[tool.poetry]
name = "promisingstocksfinder"
version = "0.1.0"
description = "To the moon"
authors = ["Daniil Roman <danroman17397@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^3.0.0"
yfinance = "^1.1.0"
prophet = "^1.3.0"
telepot = "^12.7"
python-decouple = "^3.8"
beautifulsoup4 = "^4.14.3"
deap = "^1.4.3"
numpy = "^2.4.1"
cvxpy = "^1.6.0"
arch = "^8.0.0"
pydantic-settings = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.9"
mypy = "^1.0"
pre-commit = "^4.0"
hypothesis = "^6.152.7"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-s"  # Disable output capturing by default

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true

[[tool.mypy.overrides]]
module = ["requests.*", "telepot.*", "deap.*", "arch.*", "prophet.*", "cvxpy.*", "yfinance.*", "pydantic_settings.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["config.configuration"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.adapter.out.optimization.optimizer_cvxpy"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.adapter.out.parser.html_parser"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_unused_ignores = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.packages]]
include = "src"

[[tool.poetry.packages]]
include = "config"
